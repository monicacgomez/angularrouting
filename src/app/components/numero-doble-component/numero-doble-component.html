<h1> Doble parámetros </h1>

@for (item of [].constructor(3); track $index) {
    <a [routerLink]="['/doble']">
        Doble {{$index+5}}
    </a>
}

<button (click)="goToHome()">
    Go to home
</button>
<button (click)="redirect (88)">
    Doble 88
</button>
<button (click)="redirect (99)">
    Doble 99
</button>
<button (click)="redirect (997)">
    Doble 997
</button>

@if (numero) {
    <h2 style="color: #6d6943">
        El doble del número {{numero}} es {{doble}}
    </h2>
}@else{
    <h2 style="color:#700143">
        No hemos recibido el parámetro
    </h2>
}
